# Builds the packages for each version tag (v0.2.0…) and publishes them in a
# GitHub release, with the signed update files and latest.json read by the
# in-app updater. Linux is built on Ubuntu 22.04 (oldest supported glibc).
#
# Required repository secret: TAURI_SIGNING_PRIVATE_KEY (content of the private
# key whose public half is in src-tauri/tauri.conf.json > plugins.updater).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: appimage,deb,rpm
          - platform: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - name: Paquets, signatures et latest.json
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ConstellaUML ${{ github.ref_name }}
          releaseBody: "Téléchargements ci-dessous. Mode d'emploi : packaging/LISEZMOI.md du dépôt."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}

  extras:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: PKGBUILD et mode d'emploi
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/arch/PKGBUILD
            packaging/LISEZMOI.md
