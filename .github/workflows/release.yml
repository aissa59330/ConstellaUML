# Builds the packages for each version tag (v0.3.0…) and publishes them in a
# GitHub release, with the signed update files and latest.json read by the
# in-app updater. Linux is built on Ubuntu 22.04 (oldest supported glibc).
#
# Required repository secret: TAURI_SIGNING_PRIVATE_KEY (content of the private
# key whose public half is in src-tauri/tauri.conf.json > plugins.updater).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: appimage,deb,rpm
          - platform: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - name: Paquets, signatures et latest.json
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ConstellaUML ${{ github.ref_name }}
          releaseBody: "Téléchargements ci-dessous. Mode d'emploi : packaging/LISEZMOI.md du dépôt."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}

  extras:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: PKGBUILD et mode d'emploi
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/arch/PKGBUILD
            packaging/LISEZMOI.md

  # pacman package for Arch Linux, rebuilt from the .deb with packaging/arch/PKGBUILD,
  # signed like the other packages and added to latest.json (target
  # linux-x86_64-pacman) so the in-app updater can install it through pacman.
  arch:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Paquet pacman signé
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          pacman -Syu --noconfirm nodejs npm
          VER="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          useradd -m builder
          mkdir /build && cp packaging/arch/PKGBUILD /build/ && cd /build
          sed -i "s/^pkgver=.*/pkgver=$VER/" PKGBUILD
          curl -fsSLO "$BASE/ConstellaUML_${VER}_amd64.deb"
          chown -R builder /build
          sudo -u builder makepkg -f --nodeps
          PKG=$(ls constella-bin-"$VER"-*-x86_64.pkg.tar.zst)
          npx --yes @tauri-apps/cli@2 signer sign "$PKG"
          curl -fsSL -o latest.json "$BASE/latest.json"
          PKG="$PKG" BASE="$BASE" node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            j.platforms["linux-x86_64-pacman"] = {
              signature: fs.readFileSync(process.env.PKG + ".sig", "utf8").trim(),
              url: process.env.BASE + "/" + process.env.PKG,
            };
            fs.writeFileSync("latest.json", JSON.stringify(j, null, 2));
          '
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$PKG" "$PKG.sig" latest.json "$GITHUB_WORKSPACE/out/"
      - name: Publier le paquet et latest.json
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: out/*
