# Builds the Linux packages on Ubuntu 22.04 (oldest supported glibc) for each
# version tag (v0.1.0…) and attaches them to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - name: Paquets AppImage, .deb, .rpm
        run: npx tauri build
      - name: Sommes de contrôle
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm packaging/arch/PKGBUILD packaging/LISEZMOI.md out/
          cd out && sha256sum *.AppImage *.deb *.rpm > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: constella-linux
          path: out/*
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
