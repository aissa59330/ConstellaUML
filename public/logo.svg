<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Constella</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1F4B"/>
      <stop offset="0.55" stop-color="#2B2A7A"/>
      <stop offset="1" stop-color="#0E6E78"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6ECFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE7A3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFC24B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fond -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- constellation (liens) -->
  <g stroke="#9FB4FF" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M378 128 L430 86"/>
    <path d="M378 128 L440 204"/>
    <path d="M152 384 L96 430"/>
  </g>

  <!-- boîte de classe UML (3 compartiments) -->
  <g>
    <rect x="128" y="128" width="250" height="256" rx="22" fill="url(#box)"/>
    <rect x="128" y="128" width="250" height="78" rx="22" fill="#FFC24B"/>
    <rect x="128" y="184" width="250" height="22" fill="#FFC24B"/>
    <line x1="128" y1="206" x2="378" y2="206" stroke="#1B1F4B" stroke-width="8"/>
    <line x1="128" y1="296" x2="378" y2="296" stroke="#1B1F4B" stroke-width="8"/>
    <!-- attributs / opérations stylisés -->
    <g stroke="#2B2A7A" stroke-width="14" stroke-linecap="round">
      <line x1="164" y1="242" x2="300" y2="242"/>
      <line x1="164" y1="268" x2="250" y2="268"/>
      <line x1="164" y1="332" x2="320" y2="332"/>
      <line x1="164" y1="358" x2="272" y2="358"/>
    </g>
    <!-- nom -->
    <rect x="186" y="156" width="134" height="22" rx="11" fill="#1B1F4B"/>
  </g>

  <!-- étoiles (nœuds de la constellation) -->
  <circle cx="378" cy="128" r="46" fill="url(#glow)"/>
  <path d="M378 100 L386 120 L406 128 L386 136 L378 156 L370 136 L350 128 L370 120 Z" fill="#FFF4D2"/>
  <circle cx="430" cy="86" r="11" fill="#FFFFFF"/>
  <circle cx="440" cy="204" r="9" fill="#BFF3F0"/>
  <circle cx="152" cy="384" r="12" fill="#FFFFFF"/>
  <circle cx="96" cy="430" r="8" fill="#BFF3F0"/>
</svg>
